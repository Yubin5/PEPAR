# 설정은 config.toml 하나로: 먼저 cp config.example.toml config.toml
services:
  pepar:
    build: .
    init: true
    ports: ["127.0.0.1:8765:8765"]  # 바깥에서 쓸 포트를 바꾸려면 앞쪽 8765를
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - pepar-cache:/app/cache
      - type: bind  # 없으면 디렉터리를 만들지 않고 오류를 낸다 (config.toml을 먼저 만들 것)
        source: ./config.toml
        target: /app/config.toml
        read_only: true
    restart: unless-stopped
volumes:
  pepar-cache:
