services:
  pepar:
    build: .
    init: true
    # 주소·포트는 config.toml을 따르고, 127.0.0.1에만 열린 LLM 서버에도 닿는다
    network_mode: host
    volumes:
      - pepar-cache:/app/cache
      # 파일 하나를 연결하면 그 파일이 없을 때 Docker가 빈 폴더를 만든다: 폴더째 연결
      - .:/app/conf:ro
    restart: unless-stopped
volumes:
  pepar-cache:
