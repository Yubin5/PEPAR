# 설정은 이 폴더의 config.toml 하나로
services:
  pepar:
    build: .
    init: true
    ports: ["127.0.0.1:8000:8000"]  # 바깥에서 쓸 포트를 바꾸려면 앞쪽 8000을
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - pepar-cache:/app/cache
      # 파일 하나(./config.toml)를 연결하면, 그 파일이 없을 때 Docker가 같은 이름의 빈 폴더를 만들어 버린다.
      # 그래서 이 폴더 전체를 읽기 전용으로 연결하고, 그 안의 config.toml을 읽는다 (없으면 기본값)
      - .:/app/conf:ro
    restart: unless-stopped
volumes:
  pepar-cache:
