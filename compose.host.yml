# 번역 모델 서버가 이 컴퓨터의 127.0.0.1에서만 열려 있을 때 (리눅스):
#   docker compose -f compose.yml -f compose.host.yml up -d
# 컨테이너가 이 컴퓨터의 네트워크를 그대로 쓴다. 주소·포트는 config.toml의 host·port를 따른다
services:
  pepar:
    network_mode: host
    ports: !reset []
    extra_hosts: !reset []
    environment:
      PEPAR_HOST: ""  # 비워 두면 Dockerfile의 0.0.0.0:8765 대신 config.toml의 값
      PEPAR_PORT: ""
